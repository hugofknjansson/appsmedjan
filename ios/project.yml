# The App Dance iPhone app: a native client for the same server as the web client.
# Generate the Xcode project with `xcodegen generate` in this folder.
name: AppDance
options:
  createIntermediateGroups: true
  developmentLanguage: sv
  knownRegions: [sv, en]
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Everything in a UI app starts on the main actor; concurrency is added only where it is needed.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Lets Xcode see the strings in the code, so the string catalog can be checked against them.
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  AppDance:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: App Dance
        # From the build settings, so an upload can be given a new build number on the command line.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [sv, en]
        # Only what iOS itself provides (https); saves a question at every upload.
        ITSAppUsesNonExemptEncryption: false
        # The brand orange while the app starts; the first screen continues from it.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Lets a development build talk to a server on this Mac over plain http. Other hosts need https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.appsmedjan.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # For a real phone or TestFlight: `APPLE_TEAM_ID=XXXXXXXXXX xcodegen generate`. Empty is fine for the simulator.
        DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: [AppDanceTests]
  AppDanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AppDance
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.appsmedjan.ios.tests
