# fly.toml app configuration file generated for appsmedjan on 2026-11-19T17:11:41+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'appsmedjan'
primary_region = 'arn'

[build]
[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '8080'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/config'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
